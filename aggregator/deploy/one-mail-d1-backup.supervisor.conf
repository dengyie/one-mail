; one-mail D1 逻辑备份（pxed 无 systemd/cron，由 supervisord 托管）。
; 只有 /opt/one-mail-agg/d1-backup.json 与 d1-backup.token 都存在时部署才会
; 安装本 program；否则保持不启用。首次备份在进程启动时立即补跑，之后每天
; 在配置的 UTC 时间执行。
;
; api.cloudflare.com 需要与聚合器相同的 Mihomo 代理出口。
[program:one-mail-d1-backup]
command=/opt/one-mail-agg/d1-backup.sh
directory=/opt/one-mail-agg/aggregator
autostart=true
autorestart=true
startsecs=2
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/one-mail-agg/d1-backup.supervisor.out.log
stderr_logfile=/opt/one-mail-agg/d1-backup.supervisor.err.log
environment=PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin",PYTHONUNBUFFERED="1",HTTP_PROXY="http://127.0.0.1:7897",HTTPS_PROXY="http://127.0.0.1:7897",NO_PROXY="127.0.0.1,localhost"
