; one-mail attachment object storage on the same VPS as the aggregator.
[program:one-mail-attachment-storage]
command=/opt/one-mail-agg/attachment-storage.sh
directory=/opt/one-mail-agg/aggregator
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/one-mail-agg/attachment-storage.supervisor.out.log
stderr_logfile=/opt/one-mail-agg/attachment-storage.supervisor.err.log
stopsignal=TERM
stopwaitsecs=10
