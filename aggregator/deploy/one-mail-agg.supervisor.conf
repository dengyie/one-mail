; one-mail IMAP 聚合器常驻循环（pxed 无 systemd/cron，由 supervisord 托管）。
; 部署：cp deploy/one-mail-agg.supervisor.conf /personal/pxed/ 然后纳入
; /personal/pxed/supervisord.conf 的 include，supervisorctl update 即可拉起。
; 每 300s 跑一次 one_mail_agg.main（循环本体在 agg-loop.sh，含超时与失败重试）。
[program:one-mail-agg]
command=/opt/one-mail-agg/agg-loop.sh
directory=/opt/one-mail-agg/aggregator
autostart=true
autorestart=true
startsecs=1
startretries=100
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/one-mail-agg/agg.supervisor.out.log
stderr_logfile=/opt/one-mail-agg/agg.supervisor.err.log
environment=PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin",PYTHONUNBUFFERED="1"
