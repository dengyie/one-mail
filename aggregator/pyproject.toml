[project]
name = "one-mail-agg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "imapclient>=3.0",
    "requests>=2.31",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
