name: Deploy Aggregator (tencent-lh)

# aggregator/** 变更推送到 main 时，把聚合器源码部署到 tencent-lh
# （212.64.10.215）：systemd `one-mail-agg.service` + `one-mail-attachment-storage.service`，
# 代码根 /opt/one-mail-agg（agg-loop.sh / attachment-storage.sh / attachment-storage.token
# 为受管文件，config.json 与 venv 为节点本地资产，CI 从不触碰）。
# pxed（supervisord + 私有 nginx 形态）已于 2026-11-25/26 报废；本 workflow 已改写为
# systemd 语义：stage/backup/swap + venv 导入探针 + 附件存储先启 + backend 部署顺序门
# （同 SHA 的 backend_deploy.yaml 成功后才重启聚合器）+ 失败自动回滚。
# D1 备份程序不随 CI 部署（pxed 时代为 supervisord program，新宿主尚未重建，独立待办）。

on:
  push:
    branches:
      - main
    paths:
      - aggregator/**
      - .github/workflows/aggregator_deploy.yaml
  workflow_dispatch:

concurrency:
  group: deploy-aggregator-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Aggregator to tencent-lh
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pack aggregator source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.venv' \
            --exclude='*.egg-info' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            -czf /tmp/one-mail-aggregator.tgz \
            -C aggregator .

      - name: Configure pinned SSH key
        shell: bash
        env:
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_KNOWN_HOSTS: ${{ secrets.LH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${LH_SSH_KEY:-}" ] || [ -z "${LH_SSH_HOST:-}" ]; then
            echo "::error::Missing LH_SSH_KEY or LH_SSH_HOST; refusing aggregator deploy."
            exit 1
          fi
          if [ -z "${LH_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Missing LH_SSH_KNOWN_HOSTS; refusing deploy without a pinned host key."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          KEY_LINE=$(printf '%s\n' "$LH_SSH_KNOWN_HOSTS" | awk 'NF>=2 {line=$(NF-1)" "$NF} END{print line}')
          if [ -z "$KEY_LINE" ]; then
            echo "::error::LH_SSH_KNOWN_HOSTS contains no SSH public key."
            exit 1
          fi
          printf '%s\n' "$KEY_LINE" > /tmp/pinned_key
          if ! ssh-keygen -lf /tmp/pinned_key >/dev/null 2>&1; then
            echo "::error::LH_SSH_KNOWN_HOSTS does not end with a valid SSH public key."
            exit 1
          fi
          rm -f /tmp/pinned_key
          {
            printf '[%s]:%s %s\n' "$LH_SSH_HOST" "${LH_SSH_PORT:-22}" "$KEY_LINE"
            printf '%s %s\n' "$LH_SSH_HOST" "$KEY_LINE"
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install aggregator and attachment storage
        shell: bash
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
          ATTACHMENT_STORAGE_TOKEN: ${{ secrets.ATTACHMENT_STORAGE_TOKEN }}
          D1_BACKUP_API_TOKEN: ${{ secrets.D1_BACKUP_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ATTACHMENT_STORAGE_TOKEN:-}" ] || [ "${#ATTACHMENT_STORAGE_TOKEN}" -lt 32 ]; then
            echo "::error::Missing ATTACHMENT_STORAGE_TOKEN or token is shorter than 32 characters."
            exit 1
          fi
          PORT="${LH_SSH_PORT:-22}"
          USER="${LH_SSH_USER:-root}"
          SCP_OPTS=(-O -P "$PORT" -o StrictHostKeyChecking=yes)
          SSH_OPTS=(-p "$PORT" -o StrictHostKeyChecking=yes)
          # The host takes Internet-wide brute-force scans; sshd can drop new
          # connections at kex when its pre-auth window saturates. Retry a few
          # times before giving up — a dropped handshake is transient, a real
          # auth/config failure is not.
          remote_ssh() {
            local attempt out
            for attempt in 1 2 3 4; do
              # shellcheck disable=SC2029 # "$@" is forwarded literally on purpose; the remote side re-expands by design.
              if out=$(ssh "${SSH_OPTS[@]}" "$USER@$LH_SSH_HOST" "$@" 2>&1); then
                printf '%s\n' "$out"
                return 0
              fi
              if ! printf '%s' "$out" | grep -qE 'kex_exchange_identification|Connection reset|Connection closed'; then
                printf '%s\n' "$out" >&2
                return 1
              fi
              echo "SSH attempt $attempt hit a reset handshake; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            printf '%s\n' "$out" >&2
            return 1
          }

          REMOTE_STAGE=$(remote_ssh 'mktemp -d /tmp/one-mail-deploy.XXXXXXXXXX')
          cleanup_remote_stage() {
            if [ -n "${REMOTE_STAGE:-}" ]; then
              # shellcheck disable=SC2029 # Intentional: expand the mktemp path on the runner, pass it as a literal to the pinned host.
              remote_ssh "rm -rf -- '$REMOTE_STAGE'" || true
            fi
          }
          trap cleanup_remote_stage EXIT
          # The stage path is intentionally expanded by the runner into each
          # scp destination; the remote shell receives it as a literal path.
          # shellcheck disable=SC2029
          scp "${SCP_OPTS[@]}" /tmp/one-mail-aggregator.tgz \
            "$USER@$LH_SSH_HOST:$REMOTE_STAGE/aggregator.tgz"
          # shellcheck disable=SC2029
          printf '%s' "$ATTACHMENT_STORAGE_TOKEN" | \
            ssh "${SSH_OPTS[@]}" "$USER@$LH_SSH_HOST" \
            "umask 077; cat > '$REMOTE_STAGE/attachment-storage.token'; chmod 0600 '$REMOTE_STAGE/attachment-storage.token'"

          # The D1 backup program is optional: no token means no unit.
          if [ -n "${D1_BACKUP_API_TOKEN:-}" ]; then
            if [ "${#D1_BACKUP_API_TOKEN}" -lt 20 ]; then
              echo "::error::D1_BACKUP_API_TOKEN is shorter than 20 characters."
              exit 1
            fi
            # shellcheck disable=SC2029
            printf '%s' "$D1_BACKUP_API_TOKEN" | \
              ssh "${SSH_OPTS[@]}" "$USER@$LH_SSH_HOST" \
              "umask 077; cat > '$REMOTE_STAGE/d1-backup.token'; chmod 0600 '$REMOTE_STAGE/d1-backup.token'"
          else
            echo "D1_BACKUP_API_TOKEN is not set; the D1 backup program stays disabled"
          fi

          # shellcheck disable=SC2029
          ssh "${SSH_OPTS[@]}" "$USER@$LH_SSH_HOST" "REMOTE_STAGE='$REMOTE_STAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf "$REMOTE_STAGE"' EXIT
          BASE=/opt/one-mail-agg
          AGG="$BASE/aggregator"
          STAGE="$BASE/.aggregator-stage.$$"
          BACKUP="$BASE/.aggregator-backup-current"
          exec 9>/tmp/one-mail-agg-deploy.lock
          flock 9

          save_runtime_file() {
            name=$1
            source=$2
            if [ -e "$source" ] || [ -L "$source" ]; then
              mv "$source" "$BACKUP/runtime/$name"
              : > "$BACKUP/runtime/$name.present"
            fi
          }

          restore_runtime_file() {
            name=$1
            target=$2
            if [ -f "$BACKUP/runtime/$name.present" ]; then
              mv "$BACKUP/runtime/$name" "$target"
            else
              rm -f "$target"
            fi
          }

          restore_previous() {
            status=${1:-$?}
            set +e
            rollback_failed=0
            if [ "$status" -eq 0 ]; then
              rm -rf "$STAGE" "$REMOTE_STAGE"
              return 0
            fi
            echo "Aggregator deployment failed; restoring the previous managed source" >&2
            for path in src tests deploy pyproject.toml README.md; do
              marker_path=${path//\//_}
              if [ -f "$BACKUP/runtime/managed-$marker_path.touched" ]; then
                if [ -e "$AGG/$path" ] || [ -L "$AGG/$path" ]; then
                  rm -rf "$AGG/$path" || rollback_failed=1
                fi
                if [ -e "$BACKUP/$path" ] || [ -L "$BACKUP/$path" ]; then
                  mv "$BACKUP/$path" "$AGG/$path" || rollback_failed=1
                fi
              fi
            done
            if [ -f "$BACKUP/runtime/snapshot-complete" ]; then
              restore_runtime_file agg-loop.sh "$BASE/agg-loop.sh" || rollback_failed=1
              # Until the matching backend deploy is confirmed, roll the storage
              # side back too so the host returns to its exact prior state.
              if [ ! -f "$BACKUP/runtime/backend-ready" ]; then
                restore_runtime_file attachment-storage.sh "$BASE/attachment-storage.sh" || rollback_failed=1
                restore_runtime_file attachment-storage.token "$BASE/attachment-storage.token" || rollback_failed=1
                if [ "$(cat "$BACKUP/runtime/storage-was-running" 2>/dev/null)" = "yes" ]; then
                  systemctl restart one-mail-attachment-storage || rollback_failed=1
                fi
              fi
              if [ -f "$BACKUP/runtime/agg-restart-attempted" ] \
                && [ "$(cat "$BACKUP/runtime/agg-was-running" 2>/dev/null)" = "yes" ]; then
                systemctl restart one-mail-agg || rollback_failed=1
              fi
            fi
            if [ "$rollback_failed" -eq 0 ]; then
              rm -rf "$BACKUP"
            else
              echo "Rollback was incomplete; preserving $BACKUP for recovery" >&2
            fi
            rm -rf "$STAGE" "$REMOTE_STAGE"
            return "$status"
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then restore_previous "$status" || true; else rm -rf "$STAGE" "$REMOTE_STAGE"; fi; exit "$status"' EXIT

          test -f "$BASE/config.json"
          test -x "$AGG/.venv/bin/python"

          # Stage and validate the complete archive before touching the live
          # source. Preserve local runtime state and the existing venv.
          if [ -e "$BACKUP" ]; then
            echo "An unfinished deployment backup exists; refusing to overwrite it" >&2
            exit 1
          fi
          rm -rf "$STAGE"
          mkdir -p "$STAGE" "$BACKUP"
          chmod 0700 "$BACKUP"
          mkdir -m 0700 "$BACKUP/runtime"
          if [ "$(systemctl is-active one-mail-agg 2>/dev/null || true)" = "active" ]; then
            printf yes > "$BACKUP/runtime/agg-was-running"
          fi
          if [ "$(systemctl is-active one-mail-attachment-storage 2>/dev/null || true)" = "active" ]; then
            printf yes > "$BACKUP/runtime/storage-was-running"
          fi
          save_runtime_file agg-loop.sh "$BASE/agg-loop.sh"
          save_runtime_file attachment-storage.sh "$BASE/attachment-storage.sh"
          save_runtime_file attachment-storage.token "$BASE/attachment-storage.token"
          : > "$BACKUP/runtime/snapshot-complete"
          tar xzf "$REMOTE_STAGE/aggregator.tgz" -C "$STAGE"
          test -f "$STAGE/pyproject.toml"
          test -d "$STAGE/src/one_mail_agg"
          test -f "$STAGE/deploy/agg-loop.sh"
          test -f "$STAGE/deploy/attachment-storage.sh"
          test -f "$STAGE/deploy/d1-backup-install.sh"
          test -f "$STAGE/deploy/d1-backup.sh"
          test -f "$STAGE/deploy/one-mail-d1-backup.service"
          PYTHONPATH="$STAGE/src" "$AGG/.venv/bin/python" -c \
            'import one_mail_agg.d1_backup, one_mail_agg.mutation_jobs, one_mail_agg.mutation_main, one_mail_agg.storage_server; print("staged aggregator import OK")'

          # Move the old managed paths aside, then install the staged paths.
          # The trap restores these paths if any later step fails.
          for path in src tests deploy pyproject.toml README.md; do
            marker_path=${path//\//_}
            : > "$BACKUP/runtime/managed-$marker_path.touched"
            if [ -e "$AGG/$path" ] || [ -L "$AGG/$path" ]; then
              mv "$AGG/$path" "$BACKUP/$path"
            fi
            if [ -e "$STAGE/$path" ] || [ -L "$STAGE/$path" ]; then
              mv "$STAGE/$path" "$AGG/$path"
            fi
          done

          "$AGG/.venv/bin/pip" install --no-deps -e "$AGG"
          install -m 0755 "$AGG/deploy/agg-loop.sh" "$BASE/agg-loop.sh"

          # Import check is side-effect free: it verifies the deployed venv sees
          # the new queue worker without claiming a real production mutation.
          "$AGG/.venv/bin/python" -c \
            'import one_mail_agg.mutation_jobs, one_mail_agg.mutation_main; print("mutation worker import OK")'

          install -m 0600 "$REMOTE_STAGE/attachment-storage.token" "$BASE/attachment-storage.token"
          install -m 0755 "$AGG/deploy/attachment-storage.sh" "$BASE/attachment-storage.sh"
          install -d -m 0700 /opt/one-mail-attachments

          systemctl restart one-mail-attachment-storage
          STORAGE_STATE=""
          for attempt in $(seq 1 15); do
            STORAGE_STATE=$(systemctl is-active one-mail-attachment-storage 2>/dev/null || true)
            printf 'attachment storage readiness %s/15: %s\n' "$attempt" "$STORAGE_STATE"
            if [ "$STORAGE_STATE" = "active" ]; then
              break
            fi
            if [ "$STORAGE_STATE" = "failed" ]; then
              break
            fi
            sleep 1
          done
          if [ "$STORAGE_STATE" != "active" ]; then
            journalctl -u one-mail-attachment-storage -n 80 --no-pager >&2 || true
            echo "attachment storage did not reach active (state: $STORAGE_STATE)" >&2
            exit 1
          fi

          # D1 logical backups (no R2): optional, token-driven, never gates
          # the mail deployment. Installs the systemd unit when both the
          # staged token and the operator config exist.
          BASE="$BASE" AGG="$AGG" STAGE="$REMOTE_STAGE" \
            bash "$AGG/deploy/d1-backup-install.sh" install

          rm -rf "$REMOTE_STAGE"
          trap - EXIT
          rm -rf "$STAGE"
          REMOTE

      - name: Wait for matching backend deployment before restarting aggregator
        env:
          GH_TOKEN: ${{ github.token }}
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "workflow_dispatch: backend ordering check skipped"
            exit 0
          fi
          changed=$(git diff-tree -m --no-commit-id --name-only -r "$GITHUB_SHA")
          if ! printf '%s\n' "$changed" | grep -Eq '^(worker/|db/|packages/shared/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/backend_deploy\.yaml$)'; then
            echo "This commit does not change the Worker deployment; restarting aggregator now"
            exit 0
          fi
          for attempt in $(seq 1 60); do
            run=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/backend_deploy.yaml/runs?head_sha=${GITHUB_SHA}&per_page=10" \
              --jq '.workflow_runs | sort_by(.run_number) | last | [.status, (.conclusion // "")] | @tsv' \
              2>/dev/null || true)
            status=$(printf '%s' "$run" | cut -f1)
            conclusion=$(printf '%s' "$run" | cut -f2)
            case "$status:$conclusion" in
              completed:success)
                PORT="${LH_SSH_PORT:-22}"
                USER="${LH_SSH_USER:-root}"
                ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" \
                  'touch /opt/one-mail-agg/.aggregator-backup-current/runtime/backend-ready'
                echo "Matching backend deployment succeeded; continuing"
                exit 0
                ;;
              completed:*)
                echo "::error::Matching backend deployment ended with conclusion: ${conclusion:-unknown}"
                exit 1
                ;;
              queued:*|in_progress:*)
                echo "Backend deployment is $status (attempt $attempt/60); waiting"
                ;;
              *)
                echo "Backend deployment run is not visible yet (attempt $attempt/60); waiting"
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the matching backend deployment"
          exit 1

      - name: Restart aggregator after backend is ready
        shell: bash
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${LH_SSH_PORT:-22}"
          USER="${LH_SSH_USER:-root}"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PRE_STATUS=$(systemctl is-active one-mail-agg 2>/dev/null || true)
          echo "pre-deploy status: $PRE_STATUS"
          if [ "$PRE_STATUS" = "active" ]; then
            touch /opt/one-mail-agg/.aggregator-backup-current/runtime/agg-restart-attempted
            systemctl restart one-mail-agg
            sleep 2
            STATUS=$(systemctl is-active one-mail-agg 2>/dev/null || true)
            echo "post-restart status: $STATUS"
            if [ "$STATUS" != "active" ]; then
              journalctl -u one-mail-agg -n 40 --no-pager >&2 || true
              echo "aggregator failed to reach active" >&2
              exit 1
            fi
          else
            echo "leaving stopped as configured"
          fi
          REMOTE

      - name: Verify systemd state
        shell: bash
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
        run: |
          set -euo pipefail
          sleep 5
          PORT="${LH_SSH_PORT:-22}"
          USER="${LH_SSH_USER:-root}"
          AGG_STATUS=$(ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" \
            'systemctl is-active one-mail-agg')
          STORAGE_STATUS=$(ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" \
            'systemctl is-active one-mail-attachment-storage')
          printf '%s\n%s\n' "$AGG_STATUS" "$STORAGE_STATUS"
          case "$AGG_STATUS" in
            active|inactive) ;;
            *) echo "::error::Aggregator in unexpected state after deploy: $AGG_STATUS"; exit 1 ;;
          esac
          case "$STORAGE_STATUS" in
            active) ;;
            *) echo "::error::Attachment storage in unexpected state after deploy: $STORAGE_STATUS"; exit 1 ;;
          esac
          # Recent aggregator heartbeat, informational only.
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" \
            'tail -n 20 /opt/one-mail-agg/agg-loop.log' || true

          # The D1 backup program is auxiliary: report it, never gate on it.
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" \
            'BASE=/opt/one-mail-agg bash /opt/one-mail-agg/aggregator/deploy/d1-backup-install.sh status' || true

      - name: Roll back failed deployment
        if: failure()
        shell: bash
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${LH_SSH_PORT:-22}"
          USER="${LH_SSH_USER:-root}"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/opt/one-mail-agg
          AGG="$BASE/aggregator"
          BACKUP="$BASE/.aggregator-backup-current"
          if [ ! -d "$BACKUP" ]; then
            echo "No staged deployment backup; the install step already restored its source"
            exit 0
          fi
          restore_file() {
            name=$1
            target=$2
            if [ -f "$BACKUP/runtime/$name.present" ]; then
              mv "$BACKUP/runtime/$name" "$target"
            else
              rm -f "$target"
            fi
          }
          rollback_failed=0
          for path in src tests deploy pyproject.toml README.md; do
            marker_path=${path//\//_}
            if [ -f "$BACKUP/runtime/managed-$marker_path.touched" ]; then
              if [ -e "$AGG/$path" ] || [ -L "$AGG/$path" ]; then
                rm -rf "$AGG/$path" || rollback_failed=1
              fi
              if [ -e "$BACKUP/$path" ] || [ -L "$BACKUP/$path" ]; then
                mv "$BACKUP/$path" "$AGG/$path" || rollback_failed=1
              fi
            fi
          done
          if [ -f "$BACKUP/runtime/snapshot-complete" ]; then
            restore_file agg-loop.sh "$BASE/agg-loop.sh" || rollback_failed=1
            if [ ! -f "$BACKUP/runtime/backend-ready" ]; then
              restore_file attachment-storage.sh "$BASE/attachment-storage.sh" || rollback_failed=1
              restore_file attachment-storage.token "$BASE/attachment-storage.token" || rollback_failed=1
            fi
            # Re-register the restored source in the existing venv.
            "$AGG/.venv/bin/pip" install --no-deps -e "$AGG" || rollback_failed=1
            if [ ! -f "$BACKUP/runtime/backend-ready" ] \
              && [ "$(cat "$BACKUP/runtime/storage-was-running" 2>/dev/null)" = "yes" ]; then
              systemctl restart one-mail-attachment-storage || rollback_failed=1
            fi
            if [ -f "$BACKUP/runtime/agg-restart-attempted" ] \
              && [ "$(cat "$BACKUP/runtime/agg-was-running" 2>/dev/null)" = "yes" ]; then
              systemctl restart one-mail-agg || rollback_failed=1
            fi
          fi
          if [ "$rollback_failed" -eq 0 ]; then
            rm -rf "$BACKUP"
          else
            echo "Rollback was incomplete; preserving $BACKUP for recovery" >&2
            exit 1
          fi
          REMOTE

      - name: Finalize successful deployment
        if: success()
        shell: bash
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${LH_SSH_PORT:-22}"
          USER="${LH_SSH_USER:-root}"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" 'bash -s' <<'REMOTE'
          rm -rf /opt/one-mail-agg/.aggregator-backup-current
          rm -rf /opt/one-mail-agg/.aggregator-stage.*
          REMOTE
