name: Codium PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event.issue.pull_request &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run pr agent on trusted pull request events and comments
    steps:
      - name: Check PR Agent credentials
        id: pragent_config
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          if [[ -z "$OPENAI_KEY" || -z "$OPENAI_API_BASE" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR Agent skipped because OPENAI_KEY or OPENAI_API_BASE is not configured for this event."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR Agent action step
        if: steps.pragent_config.outputs.enabled == 'true'
        id: pragent
        uses: The-PR-Agent/pr-agent@53072488e4c3b5a6c9ae730fe6fb52fc5f09d06c
        env:
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CONFIG.MODEL: "gpt-5.4-nano"
          CONFIG.MODEL_TURBO: "gpt-5.4-nano"
          OPENAI.API_BASE: ${{ secrets.OPENAI_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
