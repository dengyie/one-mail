name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - "worker/**"
      - "packages/shared/**"
      - "db/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build @one-mail/shared
        run: pnpm --filter @one-mail/shared build

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Missing Cloudflare account ID::Set the CLOUDFLARE_ACCOUNT_ID repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare API token::Set the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${WRANGLER_TOML_CONTENT:-}" ]; then
            echo "::error title=Missing Worker configuration::Set the BACKEND_TOML repository secret before running this workflow."
            exit 1
          fi

          if [ "${USE_WORKER_ASSETS:-}" = "true" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ "${USE_WORKER_ASSETS_WITH_TELEGRAM:-}" = "true" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          cd worker/
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml

          pnpm install --no-frozen-lockfile

          if [ "${BACKEND_USE_MAIL_WASM_PARSER:-}" = "true" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          if [ "${DEBUG_MODE:-}" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy >/dev/null 2>&1; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              exit "$code"
            fi
          fi
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
          DEBUG_MODE: ${{ secrets.DEBUG_MODE }}
          BACKEND_USE_MAIL_WASM_PARSER: ${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          USE_WORKER_ASSETS: ${{ secrets.USE_WORKER_ASSETS }}
          USE_WORKER_ASSETS_WITH_TELEGRAM: ${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
