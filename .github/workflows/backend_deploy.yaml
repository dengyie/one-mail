name: Deploy Backend

on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - "worker/**"
      - "packages/shared/**"
      - "db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend_deploy.yaml"
  workflow_dispatch:

# D1 schema migration and Worker publication are one production transaction in
# deployment order. Never let two main/tag deploys race ALTER/CREATE statements.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @one-mail/shared
        run: pnpm --filter @one-mail/shared build

      - name: Resolve optional build flags
        id: build_flags
        shell: bash
        env:
          BACKEND_USE_MAIL_WASM_PARSER: ${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          USE_WORKER_ASSETS: ${{ secrets.USE_WORKER_ASSETS }}
          USE_WORKER_ASSETS_WITH_TELEGRAM: ${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
        run: |
          [[ "$BACKEND_USE_MAIL_WASM_PARSER" == "true" ]] && echo "wasm=true" >> "$GITHUB_OUTPUT" || echo "wasm=false" >> "$GITHUB_OUTPUT"
          [[ "$USE_WORKER_ASSETS" == "true" ]] && echo "assets=true" >> "$GITHUB_OUTPUT" || echo "assets=false" >> "$GITHUB_OUTPUT"
          [[ "$USE_WORKER_ASSETS_WITH_TELEGRAM" == "true" ]] && echo "telegram=true" >> "$GITHUB_OUTPUT" || echo "telegram=false" >> "$GITHUB_OUTPUT"

      - name: Build Worker frontend assets
        if: steps.build_flags.outputs.assets == 'true'
        shell: bash
        run: |
          cd frontend/
          echo "VITE_API_BASE=https://mail-api.mangoqwq.com" > .env.pages
          echo "VITE_API_BASE=https://mail-api.mangoqwq.com" > .env.production
          if [ "${{ steps.build_flags.outputs.telegram }}" = "true" ]; then
            echo "Building with telegram pages"
            pnpm build:telegram:pages
          else
            echo "Building with normal pages"
            pnpm build:pages
          fi

      - name: Prepare pinned WASM mail parser
        if: steps.build_flags.outputs.wasm == 'true'
        shell: bash
        run: |
          cd worker/
          echo "Using mail-parser-wasm-worker@0.2.2"
          pnpm add mail-parser-wasm-worker@0.2.2 --save-exact
          git apply ../.github/config/mail-parser-wasm-worker.patch
          echo "Applied mail-parser-wasm-worker patch"

      - name: Prepare Worker configuration
        shell: bash
        env:
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
        run: |
          if [ -z "${WRANGLER_TOML_CONTENT:-}" ]; then
            echo "::error title=Missing Worker configuration::Set the BACKEND_TOML repository secret before running this workflow."
            exit 1
          fi
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > worker/wrangler.toml
          chmod 600 worker/wrangler.toml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib
          path = Path("worker/wrangler.toml")
          text = path.read_text(encoding="utf-8")
          if re.search(r'(?m)^ATTACHMENT_STORAGE_URL\s*=', text):
              text = re.sub(r'(?m)^ATTACHMENT_STORAGE_URL\s*=\s*.*$', 'ATTACHMENT_STORAGE_URL = "https://inbox.mangoqwq.com/_one_mail_attachment_storage"', text)
          else:
              text = text.replace("[vars]\n", '[vars]\nATTACHMENT_STORAGE_URL = "https://inbox.mangoqwq.com/_one_mail_attachment_storage"\n', 1)
          lines = text.splitlines(keepends=True)
          without_attachment_r2 = []
          index = 0
          while index < len(lines):
              if lines[index].strip() != "[[r2_buckets]]":
                  without_attachment_r2.append(lines[index])
                  index += 1
                  continue
              end = index + 1
              while end < len(lines) and not lines[end].lstrip().startswith("["):
                  end += 1
              stanza = "".join(lines[index:end])
              bucket = tomllib.loads(stanza).get("r2_buckets", [{}])[0]
              if bucket.get("binding") != "ATTACHMENTS":
                  without_attachment_r2.extend(lines[index:end])
              index = end
          text = "".join(without_attachment_r2)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate production Worker bindings
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import tomllib

          with open("worker/wrangler.toml", "rb") as config_file:
              config = tomllib.load(config_file)

          bindings = {
              "D1": {item.get("binding") for item in config.get("d1_databases", [])},
              "KV": {item.get("binding") for item in config.get("kv_namespaces", [])},
              "R2": {item.get("binding") for item in config.get("r2_buckets", [])},
              "DO": {item.get("name") for item in config.get("durable_objects", {}).get("bindings", [])},
              "send_email": {item.get("name") for item in config.get("send_email", [])},
          }
          required = {
              "D1": {"DB"},
              "KV": {"KV"},
              "DO": {"PASSKEY_CHALLENGES", "D1_QUOTA_COORDINATOR", "FLEET_REGISTRY"},
              "send_email": {"SEND_MAIL"},
          }
          missing = [f"{kind}:{name}" for kind, names in required.items()
                     for name in names - bindings[kind]]
          if missing:
              print("::error title=Incomplete production Worker configuration::Missing required bindings: " + ", ".join(missing))
              sys.exit(1)
          if "ATTACHMENTS" in bindings["R2"]:
              print("::error title=Legacy attachment R2 binding remains::VPS attachment storage is required; remove the ATTACHMENTS R2 binding.")
              sys.exit(1)

          storage_url = config.get("vars", {}).get("ATTACHMENT_STORAGE_URL")
          if not isinstance(storage_url, str) or not storage_url.startswith("https://") or not storage_url.rstrip("/"):
              print("::error title=Missing attachment storage URL::BACKEND_TOML vars.ATTACHMENT_STORAGE_URL must be an HTTPS URL.")
              sys.exit(1)
          print("Production Worker config passed required binding and VPS storage checks")
          PY

      - name: Configure Worker attachment storage secret
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ATTACHMENT_STORAGE_TOKEN: ${{ secrets.ATTACHMENT_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare credentials::Worker secret update requires CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "${ATTACHMENT_STORAGE_TOKEN:-}" ] || [ "${#ATTACHMENT_STORAGE_TOKEN}" -lt 32 ]; then
            echo "::error::Missing ATTACHMENT_STORAGE_TOKEN or token is shorter than 32 characters."
            exit 1
          fi
          cd worker/
          for attempt in $(seq 1 30); do
            health_payload=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ATTACHMENT_STORAGE_TOKEN}" \
              https://inbox.mangoqwq.com/_one_mail_attachment_storage/health || true)
            if [ "$health_payload" = '{"ok":true}' ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::VPS attachment storage did not become healthy before Worker deployment."
              exit 1
            fi
            sleep 10
          done
          echo "VPS attachment storage is healthy"
          printf '%s' "$ATTACHMENT_STORAGE_TOKEN" | pnpm exec wrangler secret put ATTACHMENT_STORAGE_TOKEN >/dev/null

      - name: Ensure remote D1 provider identity schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Missing Cloudflare account ID::Set the CLOUDFLARE_ACCOUNT_ID repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare API token::Set the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi

          cd worker/
          trap 'rm -f ../.d1-emails-schema.json ../.d1-provider-identity.sql' EXIT

          # Wrangler accepts the configured D1 binding name here. Query only
          # schema metadata; never export production mail contents.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(emails)" \
            --json > ../.d1-emails-schema.json

          python3 ../db/render_idempotent_d1_migration.py \
            --schema-json ../.d1-emails-schema.json \
            --migration ../db/2026-09-12-provider-message-identity.sql \
            --output ../.d1-provider-identity.sql

          if [ -s ../.d1-provider-identity.sql ]; then
            pnpm exec wrangler d1 execute DB \
              --remote \
              --yes \
              --file ../.d1-provider-identity.sql
            echo "Remote D1 provider identity schema is current"
          else
            echo "Remote D1 emails table is not initialized yet; fresh initialization will create the current schema"
          fi

      - name: Ensure remote D1 mutation job schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare credentials::D1 migrations require CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          cd worker/
          trap 'rm -f ../.d1-mutation-schema.json ../.d1-mutation-upgrade.sql' EXIT

          # This CREATE IF NOT EXISTS is the canonical shape for fresh installs
          # and remains safe to replay against already-initialized production DBs.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --yes \
            --file ../db/2026-09-12-mail-mutation-jobs.sql

          # Existing read/star-only installations need one table rebuild to
          # widen the operation CHECK. Render it only while target_folder is
          # absent; once upgraded, every later deployment is a no-op here.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(mail_mutation_jobs)" \
            --json > ../.d1-mutation-schema.json

          python3 ../db/render_mutation_move_delete_migration.py \
            --schema-json ../.d1-mutation-schema.json \
            --migration ../db/2026-09-12-mail-mutation-move-delete.sql \
            --output ../.d1-mutation-upgrade.sql

          if [ -s ../.d1-mutation-upgrade.sql ]; then
            pnpm exec wrangler d1 execute DB \
              --remote \
              --yes \
              --file ../.d1-mutation-upgrade.sql
            echo "Remote D1 mutation job schema upgraded for move/delete"
          else
            echo "Remote D1 mutation job schema is current"
          fi

      - name: Ensure remote D1 attachment GC schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare credentials::D1 migrations require CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          cd worker/
          trap 'rm -f ../.d1-email-schema.json ../.d1-attachment-gc-schema.json ../.d1-email-attachment-gc.sql' EXIT
          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(attachment_gc)" \
            --json > ../.d1-attachment-gc-schema.json
          legacy_gc_column=$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("../.d1-attachment-gc-schema.json").read_text())
          def result_rows(value):
              if isinstance(value, dict):
                  rows = value.get("results")
                  if isinstance(rows, list):
                      yield rows
                  for child in value.values():
                      yield from result_rows(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from result_rows(child)
          candidates = list(result_rows(payload))
          if not candidates:
              raise SystemExit("attachment_gc schema query returned no result set")
          print("true" if any(row.get("name") == "r2_key" for rows in candidates for row in rows) else "false")
          PY
          )
          if [ "$legacy_gc_column" = "true" ]; then
            pnpm exec wrangler d1 execute DB --remote --yes \
              --file ../db/2026-10-17-attachment-storage-key.sql
            echo "Renamed legacy attachment GC key column to storage_key"
          fi
          # This migration is idempotent and must run before retention code can
          # access attachment_gc on an existing production database.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --yes \
            --file ../db/2026-10-05-retention-attachment-gc.sql
          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(emails)" \
            --json > ../.d1-email-schema.json
          python3 ../db/render_email_attachment_gc_migration.py \
            --schema-json ../.d1-email-schema.json \
            --migration ../db/2026-10-16-email-attachment-gc.sql \
            --output ../.d1-email-attachment-gc.sql
          if [ -s ../.d1-email-attachment-gc.sql ]; then
            pnpm exec wrangler d1 execute DB \
              --remote \
              --yes \
              --file ../.d1-email-attachment-gc.sql
            echo "Remote D1 email attachment deletion trigger is current"
          else
            echo "Remote D1 emails table is not initialized yet; attachment deletion trigger will be created with fresh schema"
          fi
          echo "Remote D1 attachment GC schema is current"

      - name: Ensure remote D1 unified mirror retry schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cd worker/
          pnpm exec wrangler d1 execute DB \
            --remote \
            --yes \
            --file ../db/2026-10-16-unified-mirror-jobs.sql
          echo "Remote D1 unified mirror retry schema is current"

      - name: Ensure remote D1 raw-mail unified identity
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cd worker/
          trap 'rm -f ../.d1-raw-mail-schema.json ../.d1-raw-mail-unified-id.sql' EXIT
          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(raw_mails)" \
            --json > ../.d1-raw-mail-schema.json
          python3 ../db/render_raw_mail_unified_id_migration.py \
            --schema-json ../.d1-raw-mail-schema.json \
            --migration ../db/2026-10-16-raw-mail-unified-id.sql \
            --output ../.d1-raw-mail-unified-id.sql
          if [ -s ../.d1-raw-mail-unified-id.sql ]; then
            pnpm exec wrangler d1 execute DB \
              --remote \
              --yes \
              --file ../.d1-raw-mail-unified-id.sql
            echo "Remote D1 raw-mail unified identity schema is current"
          else
            echo "Remote D1 raw_mails table is not initialized yet; fresh initialization creates the identity column"
          fi

      - name: Ensure remote D1 sendbox source schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare credentials::D1 migrations require CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          cd worker/
          trap 'rm -f ../.d1-sendbox-schema.json ../.d1-sendbox-source.sql' EXIT

          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(sendbox)" \
            --json > ../.d1-sendbox-schema.json

          python3 ../db/render_sendbox_source_migration.py \
            --schema-json ../.d1-sendbox-schema.json \
            --migration ../db/2026-10-04-sendbox-source.sql \
            --output ../.d1-sendbox-source.sql

          if [ -s ../.d1-sendbox-source.sql ]; then
            pnpm exec wrangler d1 execute DB \
              --remote \
              --yes \
              --file ../.d1-sendbox-source.sql
            echo "Remote D1 sendbox source schema is current"
          else
            echo "Remote D1 sendbox table is not initialized yet; fresh initialization will create the current schema"
          fi

      - name: Ensure remote D1 outbound mail schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare credentials::D1 migrations require CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          cd worker/
          trap 'rm -f ../.d1-user-mail-accounts-schema.json; rm -f ../.d1-outbound-columns.sql' EXIT

          # New outbound_mail_jobs table is created with CREATE IF NOT EXISTS
          # (idempotent; safe to replay against an already-initialized D1).
          pnpm exec wrangler d1 execute DB \
            --remote \
            --yes \
            --file ../db/2026-10-05-outbound-mail-jobs.sql

          pnpm exec wrangler d1 execute DB \
            --remote \
            --yes \
            --file ../db/2026-10-29-gmail-reroute-idempotency.sql

          # The aggregator export reads SMTP/proxy columns even when sending is
          # disabled. Repair each missing column before publishing the Worker.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(user_mail_accounts)" \
            --json > ../.d1-user-mail-accounts-schema.json

          for migration in \
            ../db/2026-10-05-user-mail-accounts-can-send.sql \
            ../db/2026-10-08-user-mail-accounts-smtp-proxy.sql; do
            python3 ../db/render_outbound_mail_migration.py \
              --schema-json ../.d1-user-mail-accounts-schema.json \
              --migration "$migration" \
              --output ../.d1-outbound-columns.sql

            if [ -s ../.d1-outbound-columns.sql ]; then
              pnpm exec wrangler d1 execute DB \
                --remote \
                --yes \
                --file ../.d1-outbound-columns.sql
            fi
          done
          echo "Remote D1 outbound mail columns verified"

      - name: Ensure remote D1 passkey challenge schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare credentials::D1 migrations require CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          cd worker/
          # The D1 passkey_challenges fallback must exist even when the
          # PASSKEY_CHALLENGES Durable Object binding is configured, so a
          # stale BACKEND_TOML can never leave passkey login without a
          # working challenge store. Idempotent; safe to replay.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --yes \
            --file ../db/2026-10-05-passkey-challenges.sql
          echo "Remote D1 passkey challenge schema is current"
          # The cron retention lock table is created by shard_schema/admin
          # db_api init, but a primary D1 provisioned before those paths ran
          # keeps the */10 cron failing with "no such table: scheduled_locks".
          # Idempotent; safe to replay.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --yes \
            --file ../db/2026-10-06-scheduled-locks.sql
          echo "Remote D1 scheduled_locks schema is current"

      - name: Deploy Backend for ${{ github.ref_name }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEBUG_MODE: ${{ secrets.DEBUG_MODE }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Missing Cloudflare account ID::Set the CLOUDFLARE_ACCOUNT_ID repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare API token::Set the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi

          cd worker/
          # wrangler prints env var values (JWT/admin secrets) in the
          # bindings table, so non-debug mode must not echo stdout.
          # Known non-secret failure: custom_domain re-PUT of
          # mail-api.mangoqwq.cc.cd returns 100117 after a successful
          # script upload. Keep that hostname out of BACKEND_TOML.
          if [ "${DEBUG_MODE:-}" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy >/dev/null 2>&1; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              echo "If the Worker script uploaded, check custom_domain 100117 (externally managed DNS) and SEND_MAIL placement (send_email must be top-level, not under [triggers])."
              exit "$code"
            fi
          fi
          echo "Deployed for ref ${{ github.ref_name }}"
