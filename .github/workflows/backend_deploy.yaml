name: Deploy Backend

on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - "worker/**"
      - "packages/shared/**"
      - "db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/backend_deploy.yaml"
  workflow_dispatch:

# D1 schema migration and Worker publication are one production transaction in
# deployment order. Never let two main/tag deploys race ALTER/CREATE statements.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @one-mail/shared
        run: pnpm --filter @one-mail/shared build

      - name: Resolve optional build flags
        id: build_flags
        shell: bash
        env:
          BACKEND_USE_MAIL_WASM_PARSER: ${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          USE_WORKER_ASSETS: ${{ secrets.USE_WORKER_ASSETS }}
          USE_WORKER_ASSETS_WITH_TELEGRAM: ${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
        run: |
          [[ "$BACKEND_USE_MAIL_WASM_PARSER" == "true" ]] && echo "wasm=true" >> "$GITHUB_OUTPUT" || echo "wasm=false" >> "$GITHUB_OUTPUT"
          [[ "$USE_WORKER_ASSETS" == "true" ]] && echo "assets=true" >> "$GITHUB_OUTPUT" || echo "assets=false" >> "$GITHUB_OUTPUT"
          [[ "$USE_WORKER_ASSETS_WITH_TELEGRAM" == "true" ]] && echo "telegram=true" >> "$GITHUB_OUTPUT" || echo "telegram=false" >> "$GITHUB_OUTPUT"

      - name: Build Worker frontend assets
        if: steps.build_flags.outputs.assets == 'true'
        shell: bash
        run: |
          cd frontend/
          if [ "${{ steps.build_flags.outputs.telegram }}" = "true" ]; then
            echo "Building with telegram pages"
            pnpm build:telegram:pages
          else
            echo "Building with normal pages"
            pnpm build:pages
          fi

      - name: Prepare pinned WASM mail parser
        if: steps.build_flags.outputs.wasm == 'true'
        shell: bash
        run: |
          cd worker/
          echo "Using mail-parser-wasm-worker@0.2.2"
          pnpm add mail-parser-wasm-worker@0.2.2 --save-exact
          git apply ../.github/config/mail-parser-wasm-worker.patch
          echo "Applied mail-parser-wasm-worker patch"

      - name: Prepare Worker configuration
        shell: bash
        env:
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
        run: |
          if [ -z "${WRANGLER_TOML_CONTENT:-}" ]; then
            echo "::error title=Missing Worker configuration::Set the BACKEND_TOML repository secret before running this workflow."
            exit 1
          fi
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > worker/wrangler.toml
          chmod 600 worker/wrangler.toml

      - name: Ensure remote D1 provider identity schema
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Missing Cloudflare account ID::Set the CLOUDFLARE_ACCOUNT_ID repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare API token::Set the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi

          cd worker/
          trap 'rm -f ../.d1-emails-schema.json ../.d1-provider-identity.sql' EXIT

          # Wrangler accepts the configured D1 binding name here. Query only
          # schema metadata; never export production mail contents.
          pnpm exec wrangler d1 execute DB \
            --remote \
            --command "PRAGMA table_info(emails)" \
            --json > ../.d1-emails-schema.json

          python3 ../db/render_idempotent_d1_migration.py \
            --schema-json ../.d1-emails-schema.json \
            --migration ../db/2026-09-12-provider-message-identity.sql \
            --output ../.d1-provider-identity.sql

          if [ -s ../.d1-provider-identity.sql ]; then
            pnpm exec wrangler d1 execute DB \
              --remote \
              --yes \
              --file ../.d1-provider-identity.sql
            echo "Remote D1 provider identity schema is current"
          else
            echo "Remote D1 emails table is not initialized yet; fresh initialization will create the current schema"
          fi

      - name: Deploy Backend for ${{ github.ref_name }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEBUG_MODE: ${{ secrets.DEBUG_MODE }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Missing Cloudflare account ID::Set the CLOUDFLARE_ACCOUNT_ID repository secret before running this workflow."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing Cloudflare API token::Set the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi

          cd worker/
          if [ "${DEBUG_MODE:-}" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy >/dev/null 2>&1; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              exit "$code"
            fi
          fi
          echo "Deployed for ref ${{ github.ref_name }}"
