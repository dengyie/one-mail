name: SSH diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce deploy SSH flow
        env:
          PXED_SSH_HOST: ${{ secrets.PXED_SSH_HOST }}
          PXED_SSH_PORT: ${{ secrets.PXED_SSH_PORT }}
          PXED_SSH_KNOWN_HOSTS: ${{ secrets.PXED_SSH_KNOWN_HOSTS }}
          PXED_SSH_USER: ${{ secrets.PXED_SSH_USER }}
          PXED_SSH_KEY: ${{ secrets.PXED_SSH_KEY }}
        run: |
          PORT="${PXED_SSH_PORT:-22}"
          echo "port empty? ${#PXED_SSH_PORT} chars; key empty? ${#PXED_SSH_KEY} chars; kh empty? ${#PXED_SSH_KNOWN_HOSTS} chars"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PXED_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          {
            printf '[%s]:%s %s\n' "$PXED_SSH_HOST" "$PORT" "$PXED_SSH_KNOWN_HOSTS"
            printf '%s %s\n' "$PXED_SSH_HOST" "$PXED_SSH_KNOWN_HOSTS"
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "--- known_hosts validation (fingerprints per line) ---"
          ssh-keygen -lf ~/.ssh/known_hosts || true
          echo "--- line 1 fields (host masked by GitHub if secret) ---"
          awk '{print "fields=" NF" type="$2}' ~/.ssh/known_hosts
          USER="${PXED_SSH_USER:-root}"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER@$PXED_SSH_HOST" hostname && echo SSH-OK || echo SSH-FAIL
