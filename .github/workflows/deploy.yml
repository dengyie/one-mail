name: CI and Deploy pxed

# push 到 main / PR 触发全套单测与构建；push main 时自动构建并部署前端至 pxed。

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-one-mail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (Shared, Worker, Frontend, Aggregator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Upload generated workspace lockfile
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pnpm-lock-candidate
          path: pnpm-lock.yaml
          retention-days: 1

      - name: Build @one-mail/shared
        run: pnpm --filter @one-mail/shared build

      - name: Run Worker tests (144 test cases)
        run: |
          cd worker
          node --experimental-strip-types --test src/core/*.test.mjs src/unified/*.test.mjs src/user_api/*.test.mjs src/email/*.test.mjs

      - name: Run Frontend tests (92 test cases)
        run: pnpm --filter @one-mail/frontend test

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run Aggregator tests (136 test cases)
        run: |
          cd aggregator
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - name: Prepare Frontend env
        run: |
          cd frontend
          echo "VITE_API_BASE=https://mail-api.mangoqwq.cc.cd" > .env.pages
          echo "VITE_API_BASE=https://mail-api.mangoqwq.cc.cd" > .env.production

      - name: Build Frontend (Production & Pages)
        run: |
          pnpm --filter @one-mail/frontend build
          pnpm --filter @one-mail/frontend build:pages

      - name: Pack Frontend dist
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/fe-dist
          tar czf /tmp/fe-dist/one-mail-fe-dist.tgz -C frontend/dist .

      - name: Upload Frontend Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one-mail-fe-dist
          path: /tmp/fe-dist/one-mail-fe-dist.tgz
          retention-days: 7

  deploy-pxed:
    name: Deploy Frontend to pxed (nginx :3301)
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: one-mail-fe-dist
          path: /tmp

      - name: Configure SSH Key
        env:
          PXED_SSH_KEY: ${{ secrets.PXED_SSH_KEY }}
          PXED_SSH_HOST: ${{ secrets.PXED_SSH_HOST }}
          PXED_SSH_PORT: ${{ secrets.PXED_SSH_PORT }}
          PXED_SSH_USER: ${{ secrets.PXED_SSH_USER }}
          PXED_SSH_KNOWN_HOSTS: ${{ secrets.PXED_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$PXED_SSH_KEY" ] || [ -z "$PXED_SSH_HOST" ]; then
            echo "::error::Missing PXED_SSH_KEY or PXED_SSH_HOST; refusing to report a successful deploy."
            exit 1
          fi
          if [ -z "$PXED_SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing PXED_SSH_KNOWN_HOSTS; refusing to deploy without a pinned SSH host key."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PXED_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key from the secret for exactly the host:port CI uses.
          # No runtime ssh-keyscan: a server presenting any other key fails closed.
          {
            printf '[%s]:%s %s\n' "$PXED_SSH_HOST" "${PXED_SSH_PORT:-22}" "$PXED_SSH_KNOWN_HOSTS"
            printf '%s %s\n' "$PXED_SSH_HOST" "$PXED_SSH_KNOWN_HOSTS"
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload & Extract Frontend dist on pxed
        env:
          PXED_SSH_HOST: ${{ secrets.PXED_SSH_HOST }}
          PXED_SSH_PORT: ${{ secrets.PXED_SSH_PORT }}
          PXED_SSH_USER: ${{ secrets.PXED_SSH_USER }}
        run: |
          PORT="${PXED_SSH_PORT:-22}"
          USER="${PXED_SSH_USER:-root}"
          scp -O -P "$PORT" -o StrictHostKeyChecking=yes /tmp/one-mail-fe-dist.tgz "$USER@$PXED_SSH_HOST:/tmp/one-mail-fe-dist.tgz"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$PXED_SSH_HOST" "rm -rf /opt/one-mail-frontend/dist && mkdir -p /opt/one-mail-frontend/dist && tar xzf /tmp/one-mail-fe-dist.tgz -C /opt/one-mail-frontend/dist"

      - name: Health Check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://inbox.mangoqwq.com/ || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed: inbox.mangoqwq.com returned 200"
              exit 0
            fi
            echo "Waiting for endpoint (attempt $i, status $code)..."
            sleep 3
          done
          echo "::error::Health check failed after 5 attempts."
          exit 1
