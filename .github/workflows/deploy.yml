name: CI and Deploy (tencent-lh)

# push 到 main / PR 触发全套单测与构建；push main 时在测试通过后把前端 dist
# 与 nginx 配置自动部署到 tencent-lh（212.64.10.215，nginx :3301）。
# pxed 已于 2026-11-25/26 报废，部署目标为 systemd 形态的 tencent-lh；
# 聚合器部署走 aggregator_deploy.yaml（systemd one-mail-agg.service）。

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-one-mail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (Shared, Worker, Frontend, Aggregator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6

      - name: Test VPS local config installer
        run: bash tests/test_pxed_local_config.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Upload generated workspace lockfile
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pnpm-lock-candidate
          path: pnpm-lock.yaml
          retention-days: 1

      - name: Build @one-mail/shared
        run: pnpm --filter @one-mail/shared build

      - name: Run Worker tests
        run: |
          cd worker
          # Intentional word-splitting: expand the discovered test files into argv.
          # shellcheck disable=SC2046
          node --experimental-strip-types --test \
            $(find src -type f \( -name '*.test.mjs' -o -name '*.test.js' \) -print)

      - name: Worker typecheck, lint, bundle, and repository gates
        run: |
          node scripts/check-file-lines.mjs
          node scripts/check-migrations.mjs
          node --test scripts/deployment-target.test.mjs
          cp worker/wrangler.toml.template worker/wrangler.toml
          pnpm --filter @one-mail/worker exec tsc --noEmit
          pnpm --filter @one-mail/worker lint
          pnpm --filter @one-mail/worker build

      - name: Frontend typecheck
        run: pnpm --filter @one-mail/frontend typecheck

      - name: Run Frontend tests
        run: pnpm --filter @one-mail/frontend test

      - name: Run DB tests
        run: pnpm --dir db test

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run Aggregator tests
        run: |
          cd aggregator
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      # The root tests/ dir was never executed by CI, so a broken smoke helper or
      # a workflow regression could merge green. They are stdlib-only apart from
      # pytest, and they run from the repo root because scripts/ is a package
      # imported as `scripts.smoke_log_checks`.
      - name: Run repository Python tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Prepare Frontend env
        run: |
          cd frontend
          # .env.prod is what `vite build -m prod` reads; without it the dist
          # ships an empty VITE_API_BASE and every API call falls back to a
          # relative path against the frontend nginx (405 login failures,
          # 2026-11-27 incident). .env.pages feeds build:pages the same way.
          echo "VITE_API_BASE=https://mail-api.mangoqwq.com" > .env.prod
          echo "VITE_API_BASE=https://mail-api.mangoqwq.com" > .env.pages
          echo "VITE_API_BASE=https://mail-api.mangoqwq.com" > .env.production

      - name: Build Frontend (Production & Pages)
        run: |
          pnpm --filter @one-mail/frontend build
          pnpm --filter @one-mail/frontend build:pages

      - name: Pack Frontend dist
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/fe-dist
          tar czf /tmp/fe-dist/one-mail-fe-dist.tgz -C frontend/dist .

      - name: Upload Frontend Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: one-mail-fe-dist
          path: /tmp/fe-dist/one-mail-fe-dist.tgz
          retention-days: 7

  deploy-lh:
    name: Deploy Frontend to tencent-lh (nginx :3301)
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6

      - name: Download Frontend Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: one-mail-fe-dist
          path: /tmp

      - name: Configure SSH Key
        env:
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
          LH_SSH_KNOWN_HOSTS: ${{ secrets.LH_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$LH_SSH_KEY" ] || [ -z "$LH_SSH_HOST" ]; then
            echo "::error::Missing LH_SSH_KEY or LH_SSH_HOST; refusing to report a successful deploy."
            exit 1
          fi
          if [ -z "$LH_SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing LH_SSH_KNOWN_HOSTS; refusing to deploy without a pinned SSH host key."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key from the secret for exactly the host:port CI uses.
          # No runtime ssh-keyscan: a server presenting any other key fails closed.
          # The secret may be a bare key ("ssh-ed25519 AAAA...") or full
          # known_hosts line(s); take the key type + body from its last line.
          KEY_LINE=$(printf '%s\n' "$LH_SSH_KNOWN_HOSTS" | awk 'NF>=2 {line=$(NF-1)" "$NF} END{print line}')
          if [ -z "$KEY_LINE" ]; then
            echo "::error::LH_SSH_KNOWN_HOSTS contains no SSH public key; refusing to deploy."
            exit 1
          fi
          printf '%s\n' "$KEY_LINE" > /tmp/pinned_key
          if ! ssh-keygen -lf /tmp/pinned_key >/dev/null 2>&1; then
            echo "::error::LH_SSH_KNOWN_HOSTS does not end with a valid SSH public key; refusing to deploy."
            exit 1
          fi
          rm -f /tmp/pinned_key
          {
            printf '[%s]:%s %s\n' "$LH_SSH_HOST" "${LH_SSH_PORT:-22}" "$KEY_LINE"
            printf '%s %s\n' "$LH_SSH_HOST" "$KEY_LINE"
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload frontend and nginx configuration on tencent-lh
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
        run: |
          PORT="${LH_SSH_PORT:-22}"
          USER="${LH_SSH_USER:-root}"
          SSH_OPTS=(-p "$PORT" -o StrictHostKeyChecking=yes)
          # The host takes Internet-wide brute-force scans; sshd can drop new
          # connections at kex when its pre-auth window saturates. Retry a few
          # times before giving up — a dropped handshake is transient, a real
          # auth/config failure is not.
          remote_ssh() {
            local attempt out
            for attempt in 1 2 3 4; do
              # shellcheck disable=SC2029 # "$@" is forwarded literally on purpose; the remote side re-expands by design.
              if out=$(ssh "${SSH_OPTS[@]}" "$USER@$LH_SSH_HOST" "$@" 2>&1); then
                printf '%s\n' "$out"
                return 0
              fi
              if ! printf '%s' "$out" | grep -qE 'kex_exchange_identification|Connection reset|Connection closed'; then
                printf '%s\n' "$out" >&2
                return 1
              fi
              echo "SSH attempt $attempt hit a reset handshake; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            printf '%s\n' "$out" >&2
            return 1
          }
          REMOTE_STAGE=$(remote_ssh 'mktemp -d /tmp/one-mail-deploy.XXXXXXXXXX')
          cleanup_remote_stage() {
            if [ -n "${REMOTE_STAGE:-}" ]; then
              # shellcheck disable=SC2029 # Intentional: expand the mktemp path on the runner, pass it as a literal to the pinned host.
              remote_ssh "rm -rf -- '$REMOTE_STAGE'" || true
            fi
          }
          trap cleanup_remote_stage EXIT
          scp -O -P "$PORT" -o StrictHostKeyChecking=yes /tmp/one-mail-fe-dist.tgz "$USER@$LH_SSH_HOST:$REMOTE_STAGE/frontend.tgz"
          scp -O -P "$PORT" -o StrictHostKeyChecking=yes deploy/nginx/one-mail-frontend.conf "$USER@$LH_SSH_HOST:$REMOTE_STAGE/one-mail-frontend.conf"
          scp -O -P "$PORT" -o StrictHostKeyChecking=yes deploy/pxed-local-config.sh "$USER@$LH_SSH_HOST:$REMOTE_STAGE/pxed-local-config.sh"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$LH_SSH_HOST" "REMOTE_STAGE='$REMOTE_STAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          source "$REMOTE_STAGE/pxed-local-config.sh"
          FRONTEND=/opt/one-mail-frontend
          DIST="$FRONTEND/dist"
          STAGE="$FRONTEND/.dist.deploy.$$"
          DIST_BACKUP="$FRONTEND/.dist.before-last-deploy.$$"
          # Debian nginx includes /etc/nginx/conf.d/*.conf; on tencent-lh the
          # include path is a symlink to the managed local config below.
          CONF=/etc/nginx/conf.d/one-mail-frontend.conf
          CONF_LOCAL="$FRONTEND/one-mail-frontend.conf"
          CONF_BACKUP="$FRONTEND/.one-mail-frontend.conf.before-last-deploy.$$"
          CONF_PROMOTED=0
          exec 9>/tmp/one-mail-nginx-deploy.lock
          flock 9
          restore_previous() {
            rm -rf "$STAGE"
            if [ -d "$DIST_BACKUP" ]; then
              rm -rf "$DIST"
              mv "$DIST_BACKUP" "$DIST"
            fi
            if [ "$CONF_PROMOTED" = 1 ] && [ -f "$CONF_BACKUP" ]; then
              pxed_restore_local_config "$CONF_BACKUP" "$CONF_LOCAL" 0644
            fi
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then restore_previous; fi; rm -rf "$REMOTE_STAGE"; exit "$status"' EXIT
          mkdir -p "$FRONTEND"
          rm -rf "$STAGE"
          mkdir "$STAGE"
          tar xzf "$REMOTE_STAGE/frontend.tgz" -C "$STAGE"
          if [ -d "$DIST" ]; then mv "$DIST" "$DIST_BACKUP"; fi
          mv "$STAGE" "$DIST"
          pxed_ensure_local_config_link "$CONF" "$CONF_LOCAL" 0644
          cp -p "$CONF_LOCAL" "$CONF_BACKUP"
          CONF_PROMOTED=1
          pxed_atomic_install_local_config "$REMOTE_STAGE/one-mail-frontend.conf" "$CONF_LOCAL" 0644
          if ! nginx -t; then
            exit 1
          fi
          if ! systemctl reload nginx; then
            exit 1
          fi
          rm -rf "$DIST_BACKUP" "$CONF_BACKUP"
          rm -rf "$REMOTE_STAGE"
          trap - EXIT
          REMOTE

      - name: Health Check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://inbox.mangoqwq.com/ || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed: inbox.mangoqwq.com returned 200"
              exit 0
            fi
            echo "Waiting for endpoint (attempt $i, status $code)..."
            sleep 3
          done
          echo "::error::Health check failed after 5 attempts."
          exit 1
