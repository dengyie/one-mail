# pxed one-mail frontend — copy of /personal/pxed/nginx/conf.d/one-mail-frontend.conf
# Cloudflare Tunnel → 127.0.0.1:3301 → /opt/one-mail-frontend/dist
#
# Apply (nginx is the pxed prefix instance, not /etc/nginx):
#   sudo cp /personal/pxed/nginx/conf.d/one-mail-frontend.conf \
#     /personal/pxed/nginx/conf.d/one-mail-frontend.conf.bak-$(date +%Y%m%d)
#   sudo nginx -t -c /personal/pxed/nginx/nginx.conf -p /personal/pxed/nginx/
#   sudo nginx -s reload -c /personal/pxed/nginx/nginx.conf -p /personal/pxed/nginx/
#
# Frontend CI only syncs dist/; this file is not deployed by GitHub Actions.

server {
    listen 127.0.0.1:3301;
    listen [::1]:3301;
    server_name one-mail-frontend;
    root /opt/one-mail-frontend/dist;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Origin is plain HTTP :3301 behind Cloudflare Tunnel. nginx would turn a
    # relative return into an absolute Location using this vhost's scheme/host
    # (http://127.0.0.1:3301 or http://inbox.mangoqwq.com:3301). Keep Location
    # relative so browsers resolve against the public HTTPS URL.
    absolute_redirect off;

    # Hard 301 for bookmarks / curl / refresh.
    # Locale list must match frontend SUPPORTED_LOCALES (zh|en|es|pt-BR|ja|de).
    # $1 is empty or "zh/" / "en/" / "pt-BR/" etc. Hash is client-only.
    # This does not match /domain-mailbox.
    location ~ ^/((?:zh|en|es|pt-BR|ja|de)/)?mailbox/?$ {
        return 301 /$1unified$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
