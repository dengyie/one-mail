# pxed one-mail frontend; managed contents live on the VPS local filesystem.
# Cloudflare Tunnel → 127.0.0.1:3301 → /opt/one-mail-frontend/dist
# The Nginx include path under /personal/pxed/nginx/conf.d is a symlink to
# /opt/one-mail-frontend/one-mail-frontend.conf.
#
# GitHub Actions deploys this config and dist/ together.

# Worker attachment proxy backend. keepalive pool avoids a TCP handshake per
# Worker-originated attachment request (2026-11-05 传输层优化).
upstream one_mail_attachment_backend {
    server 127.0.0.1:39001;
    keepalive 16;
}

server {
    listen 127.0.0.1:3301;
    listen [::1]:3301;
    server_name one-mail-frontend;
    root /opt/one-mail-frontend/dist;
    index index.html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/manifest+json;

    # Origin is plain HTTP :3301 behind Cloudflare Tunnel. nginx would turn a
    # relative return into an absolute Location using this vhost's scheme/host
    # (http://127.0.0.1:3301 or http://inbox.mangoqwq.com:3301). Keep Location
    # relative so browsers resolve against the public HTTPS URL.
    absolute_redirect off;

    # WASM MIME must be explicit: without it browsers download the parser as
    # application/octet-stream and WebAssembly.instantiateStreaming() refuses
    # it, falling back to the slower full-buffer compile path.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Service worker must revalidate every load or PWA updates stall behind
    # the browser/edge cache.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /registerSW.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Brand asset; CF edge cache rule mirrors this TTL.
    location = /logo.png {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Worker attachment proxy. The Worker supplies the storage bearer token;
    # nginx never stores or logs it and the local service is not internet-bound.
    location /_one_mail_attachment_storage/ {
        client_max_body_size 32m;
        proxy_pass http://one_mail_attachment_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hard 301 for bookmarks / curl / refresh.
    # Locale list must match frontend SUPPORTED_LOCALES (zh|en|es|pt-BR|ja|de).
    # $1 is empty or "zh/" / "en/" / "pt-BR/" etc. Hash is client-only.
    # This does not match /domain-mailbox.
    location ~ ^/((?:zh|en|es|pt-BR|ja|de)/)?mailbox/?$ {
        return 301 /$1unified$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
